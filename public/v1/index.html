<!doctype html>
<html lang="ru">
<head>
  <base href="../" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1b2418" />
  <title>Hunter Father — версия 1</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦌</text></svg>" />
  <script type="module" crossorigin src="./v1/assets/index-CqXSbxz-.js"></script>
  <link rel="stylesheet" crossorigin href="./v1/assets/index-Bp-BaE83.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Главное меню -->
  <div id="menu" class="screen">
    <div class="panel">
      <h1>Hunter Father</h1>
      <p class="sub">Охота в лесу · до 8 охотников онлайн</p>
      <label>Ник<input id="nick" maxlength="16" placeholder="Ваше имя" autocomplete="off" /></label>
      <button id="btn-solo" class="primary">Одиночная охота</button>
      <div class="online">
        <div class="row">
          <button id="btn-create" disabled>Создать комнату</button>
        </div>
        <div class="row">
          <input id="room-code" maxlength="6" placeholder="Код комнаты" disabled />
          <button id="btn-join" disabled>Войти</button>
        </div>
        <p class="note">Онлайн появится на шаге 3</p>
      </div>
      <details>
        <summary>Настройки</summary>
        <label>Графика<select id="quality"></select></label>
        <label>Время суток
          <select id="tod">
            <option value="day">День</option>
            <option value="sunset">Закат</option>
            <option value="cycle">День → закат (цикл)</option>
          </select>
        </label>
        <label>Чувствительность<input id="sens" type="range" min="0.3" max="2.5" step="0.1" /></label>
      </details>
      <p id="controls-help" class="help"></p>
    </div>
  </div>

  <div id="loading" class="screen hidden">
    <div class="panel">
      <h1>Hunter Father</h1>
      <div class="bar"><div id="load-bar"></div></div>
      <p id="load-label">Загрузка…</p>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="panel">
      <h2>Пауза</h2>
      <button id="btn-resume" class="primary">Продолжить</button>
      <label>Чувствительность<input id="sens-pause" type="range" min="0.3" max="2.5" step="0.1" /></label>
      <label>Графика<select id="quality-pause"></select></label>
      <label>Время суток
        <select id="tod-pause">
          <option value="day">День</option>
          <option value="sunset">Закат</option>
          <option value="cycle">День → закат (цикл)</option>
        </select>
      </label>
      <button id="btn-apply">Применить (перезапуск)</button>
      <button id="btn-menu">В главное меню</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="compass"><div id="compass-strip"></div><div id="compass-mark"></div></div>
    <div id="score"></div>
    <div id="fps"></div>
    <div id="ammo"></div>
    <div id="crosshair"></div>
    <div id="hitmark"></div>
    <div id="scope"><div class="reticle"></div></div>
    <div id="messages"></div>
  </div>

  <!-- Сенсорное управление -->
  <div id="touch" class="hidden">
    <div id="look-zone"></div>
    <div id="joy"><div id="joy-knob"></div></div>
    <button id="btn-fire">●</button>
    <button id="btn-aim">⌖</button>
    <button id="btn-reload">↻</button>
    <button id="btn-jump">⤒</button>
    <button id="btn-pause">❚❚</button>
  </div>


  <!-- переключатель версий -->
  <a href="./" id="ver-switch" style="position:fixed;right:14px;bottom:14px;z-index:50;padding:8px 14px;border-radius:10px;background:rgba(10,12,9,.75);color:#e8d8a8;font:600 14px -apple-system,Segoe UI,Roboto,sans-serif;text-decoration:none;border:1px solid rgba(217,164,65,.6)">← Версия 2 (новая)</a>
  <script>document.addEventListener('click',e=>{if(e.target.closest('button'))document.getElementById('ver-switch').style.display='none'},true)</script>
</body>
</html>
